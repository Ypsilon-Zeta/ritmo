<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritmo</title>
<meta name="description" content="Ritmo: il tuo Daily OS. Acqua, workout, lavoro, attività, progetti e casa in un unico posto.">
<meta name="theme-color" content="#e3e5e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ───────────── Ritmo · token di design ───────────── */
:root {
  color-scheme: light;
  --page: #e3e5e8;
  --panel: #f6f7f8;
  --inset: #eceef1;
  --line: #d5d8dd;
  --ink: #1f2228;
  --ink-2: #565b65;
  --muted: #80858e;
  --key: #262a31;
  --key-ink: #f6f7f8;
  --pad: #e8eaed;
  --pad-edge: #c6cad0;
  --acqua: #2a78d6; --workout: #eb6834; --lavoro: #1baf7a; --todo: #eda100;
  --progetti: #e87ba4; --casa: #008300; --progressi: #6250d6;
  --h0: #eceef1; --h1: #e5e4ff; --h2: #c6c3fd; --h3: #a097f2; --h4: #7c6bdf; --h5: #5a3dbd;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --r-panel: 22px; --r-pad: 14px; --r-btn: 12px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #101215; --panel: #191c20; --inset: #22262b; --line: #2c3036;
    --ink: #eceef1; --ink-2: #b6bbc4; --muted: #8a8f98;
    --key: #eceef1; --key-ink: #15171a; --pad: #23272c; --pad-edge: #0b0c0e;
    --acqua: #3987e5; --workout: #d95926; --lavoro: #199e70; --todo: #c98500;
    --progetti: #d55181; --casa: #0ca30c; --progressi: #9085e9;
    --h0: #22262b; --h1: #2c2a46; --h2: #453f75; --h3: #655aaf; --h4: #887be2; --h5: #afa7ff;
    --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #101215; --panel: #191c20; --inset: #22262b; --line: #2c3036;
  --ink: #eceef1; --ink-2: #b6bbc4; --muted: #8a8f98;
  --key: #eceef1; --key-ink: #15171a; --pad: #23272c; --pad-edge: #0b0c0e;
  --acqua: #3987e5; --workout: #d95926; --lavoro: #199e70; --todo: #c98500;
  --progetti: #d55181; --casa: #0ca30c; --progressi: #9085e9;
  --h0: #22262b; --h1: #2c2a46; --h2: #453f75; --h3: #655aaf; --h4: #887be2; --h5: #afa7ff;
  --good-ink: #0ca30c;
}

/* ───────────── base ───────────── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--progressi); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
.h1 { font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
h2, .h2 { font-size: 19px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 16px; font-weight: 700; }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }

/* ───────────── struttura ───────────── */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  padding: 22px 12px 16px; display: flex; flex-direction: column; gap: 2px;
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
.logo { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; }
.logo i { width: 7px; height: 7px; border-radius: 2px; background: var(--pad-edge); }
.logo i.on { background: var(--c); }
.nav-item {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px; border: 0; background: none; text-align: left; color: var(--ink-2);
  font-weight: 600; font-size: 15px;
}
.nav-item:hover { background: var(--inset); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; display: inline-block; }
.nav-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 14px 10px 0; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.level { display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.level b { color: var(--ink); }
.main-wrap { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px;
  padding: 14px 32px; background: color-mix(in srgb, var(--page) 86%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.topbar .title { font-weight: 700; color: var(--ink-2); margin-right: auto; }
.topbar .mob-brand { display: none; }
#main { padding: 6px 32px 72px; max-width: 1140px; }
.tabbar { display: none; }
.tab {
  display: grid; justify-items: center; gap: 2px; padding: 6px 2px 4px; border: 0; background: none;
  color: var(--muted); font-size: 11.5px; font-weight: 600; border-radius: 12px;
}
.tab .ti { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .7; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .ti { filter: none; opacity: 1; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .topbar .title { display: none; }
  .topbar .mob-brand { display: flex; margin-right: auto; padding: 0; font-size: 19px; }
  #top-score { display: none !important; }
  #main { padding: 4px 16px calc(104px + env(safe-area-inset-bottom)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  }
  .h1 { font-size: 29px; }
}

/* ───────────── blocchi ───────────── */
.stack { display: grid; gap: 16px; }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 6px 0 18px; }
.view-head .h1 { display: flex; align-items: center; gap: 12px; }
.view-head .h1 .dot { width: 14px; height: 14px; }
.panel { background: var(--panel); border-radius: var(--r-panel); padding: 20px; box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1080px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .cols, .cols-3 { grid-template-columns: 1fr; } .panel { padding: 16px; } }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.list > li:first-child { border-top: 0; }
.grow { flex: 1; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.empty { padding: 18px; border-radius: 16px; background: var(--inset); color: var(--ink-2); }
.empty b { color: var(--ink); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* ───────────── bottoni ───────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 15px; border-radius: var(--r-btn); border: 0;
  background: var(--inset); color: var(--ink); font-weight: 650; font-size: 15px; white-space: nowrap;
  box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--ink) 9%, transparent);
  transition: transform .08s, background .15s;
}
.btn:hover { background: color-mix(in srgb, var(--ink) 9%, var(--inset)); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.key { background: var(--key); color: var(--key-ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.btn.key:hover { background: color-mix(in srgb, var(--key) 88%, var(--page)); }
.btn.tint { background: color-mix(in srgb, var(--c) 16%, var(--panel)); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.btn.tint:hover { background: color-mix(in srgb, var(--c) 26%, var(--panel)); }
.btn.ghost { background: none; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--inset); color: var(--ink); }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 14px; border-radius: 10px; }
.btn.icon { width: 40px; padding: 0; }
.btn.sm.icon { width: 32px; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.kbd { font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--inset); color: var(--muted); box-shadow: inset 0 -1px 0 var(--line); }

/* ───────────── chip, barre, anelli ───────────── */
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px;
  background: var(--inset); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip.st-crit::before, .chip.st-warn::before, .chip.st-good::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
.chip.st-crit::before { background: var(--crit); }
.chip.st-warn::before { background: var(--warn); }
.chip.st-good::before { background: var(--good); }
.bar { position: relative; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--c) 20%, var(--inset)); }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--c); transition: width .6s var(--ease); }
.bar.thin { height: 6px; }
.bar.big { height: 18px; }
.bar .pace { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--panel); }
.ring { display: block; }
.ring .trk { stroke: color-mix(in srgb, var(--c) 20%, var(--inset)); }
.ring .val { stroke: var(--c); transition: stroke-dashoffset .7s var(--ease); }
.ring-wrap { position: relative; display: grid; place-items: center; }
.ring-wrap .ring-label { position: absolute; display: grid; justify-items: center; line-height: 1; }
.ring-label b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.ring-label span { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* ───────────── Oggi: sequencer ───────────── */
.today-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 8px 0 20px; }
.today-head .sub { margin-top: 6px; }
.head-stats { display: flex; align-items: center; gap: 18px; }
.mini-stat { display: grid; justify-items: end; line-height: 1.15; }
.mini-stat b { font-size: 22px; font-weight: 800; }
.mini-stat span { font-size: 12.5px; color: var(--muted); }
.seq { padding: 18px 18px 20px; }
.pads {
  list-style: none; margin: 0; padding: 4px 2px 12px; display: grid; grid-auto-flow: column;
  grid-auto-columns: minmax(92px, 1fr); gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.pads::-webkit-scrollbar { display: none; }
.pads li { scroll-snap-align: start; }
.pad {
  position: relative; width: 100%; min-height: 104px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px;
  padding: 10px 10px 12px; border: 0; border-radius: var(--r-pad); text-align: left;
  background: var(--pad); color: var(--ink-2); box-shadow: inset 0 -4px 0 var(--pad-edge);
  transition: background .25s var(--ease), transform .1s;
}
.pad:active { transform: translateY(2px); }
.pad .pe { font-size: 20px; line-height: 1; }
.pad .pl { font-size: 13px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pad .pt { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .8; }
.pad .led { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--pad-edge); }
.pad.is-done { background: var(--c); color: var(--on, #fff); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.pad.is-done .led { background: var(--on, #fff); opacity: .85; }
.pad.is-now { color: var(--ink); box-shadow: inset 0 -4px 0 var(--pad-edge), 0 0 0 2px var(--c); }
.pad.is-now .led { background: var(--c); animation: beat 1.6s ease-in-out infinite; }
.pad.is-skip { opacity: .55; background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--ink) 7%, transparent) 7px 9px); }
.pad.lit { animation: lit .5s var(--ease); }
@keyframes beat { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 50% { transform: scale(1.25); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 0%, transparent); } }
@keyframes lit { 0% { transform: scale(.94); filter: brightness(1.3); } 100% { transform: scale(1); filter: none; } }
.now {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; margin-top: 6px;
  padding: 18px; border-radius: 18px; background: var(--inset);
  box-shadow: inset 4px 0 0 var(--c);
}
.now .ne { font-size: 34px; line-height: 1; }
.now h2 { font-size: 21px; }
.now p { color: var(--ink-2); margin-top: 3px; }
.now .btns { justify-content: flex-end; }
@media (max-width: 720px) {
  .now { grid-template-columns: auto 1fr; }
  .now .btns { grid-column: 1 / -1; justify-content: stretch; }
  .now .btns .btn.key { flex: 1; }
  .today-head { align-items: flex-start; }
  .head-stats .mini-stat { display: none; }
}
.done-day { display: flex; align-items: center; gap: 14px; }
.banner {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px;
  background: color-mix(in srgb, var(--progressi) 12%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--progressi) 35%, transparent);
}
.banner p { flex: 1; }

/* tessere area */
.tiles { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1080px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
.tile { display: grid; gap: 12px; align-content: start; }
.tile-head { display: flex; align-items: center; gap: 9px; }
.tile-head h2 { font-size: 16px; flex: 1; }
.tile-head .linkbtn { font-size: 13.5px; text-decoration: none; color: var(--muted); }
.tile .val { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.tile .val small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.tile .note { font-size: 13.5px; color: var(--ink-2); }
.check {
  flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel);
  display: grid; place-items: center; padding: 0; color: transparent; transition: background .2s, border-color .2s;
}
.check:hover { border-color: var(--c, var(--ink-2)); }
.check.on { background: var(--c, var(--good)); border-color: var(--c, var(--good)); color: var(--on, #fff); }
.check svg { width: 14px; height: 14px; }
.star { border: 0; background: none; padding: 2px; font-size: 17px; line-height: 1; filter: grayscale(1); opacity: .35; }
.star.on { filter: none; opacity: 1; }

.rowbtn { flex: 1; min-width: 0; margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.rowbtn:focus-visible { outline: 2px solid var(--progressi); outline-offset: 3px; }
details.panel > summary { list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: " ▾"; color: var(--muted); font-size: .8em; }
details.panel[open] > summary::after { content: " ▴"; }

/* ───────────── form ───────────── */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 12.5px; }
.inp, select.inp, textarea.inp {
  width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea.inp { min-height: 84px; resize: vertical; line-height: 1.4; }
.inp:focus { border-color: var(--progressi); box-shadow: 0 0 0 3px color-mix(in srgb, var(--progressi) 22%, transparent); }
.inp.sm { min-height: 34px; padding: 5px 9px; font-size: 15px; border-radius: 10px; }
.form { display: grid; gap: 14px; }
.form-2 { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .form-2 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--inset); }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 10px; font-weight: 650; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line); }
.seg button .muted { font-weight: 600; }
.wd { display: flex; gap: 6px; flex-wrap: wrap; }
.wd button { width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--inset); font-weight: 700; color: var(--ink-2); }
.wd button[aria-pressed="true"] { background: var(--c, var(--key)); color: var(--on, #fff); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.toggle:first-child { border-top: 0; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s var(--ease); }
.switch input:checked + i { background: var(--good); }
.switch input:checked + i::after { transform: translateX(18px); }
.scale { display: flex; gap: 6px; }
.scale button { flex: 1; min-height: 44px; border-radius: 12px; border: 0; background: var(--inset); font-size: 20px; }
.scale button[aria-pressed="true"] { background: color-mix(in srgb, var(--progressi) 25%, var(--panel)); box-shadow: inset 0 0 0 2px var(--progressi); }
.preview { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; margin-top: 8px; }

/* ───────────── timer ───────────── */
.timer { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
@media (max-width: 720px) { .timer { grid-template-columns: 1fr; justify-items: center; text-align: center; } .timer .form { width: 100%; text-align: left; } }

.legend { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }

details.data { margin-top: 10px; }

#toasts { position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100% - 24px)); pointer-events: none; }

#tip {
  position: fixed; z-index: 70; pointer-events: none; padding: 7px 10px; border-radius: 10px; background: var(--key); color: var(--key-ink);

/* ───────────── terminale e widget ───────────── */
.tile.span2 { grid-column: span 2; }
@media (max-width: 560px) { .tile.span2 { grid-column: auto; } }
textarea.code, .term { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
textarea.code { font-size: 13px; line-height: 1.5; tab-size: 2; white-space: pre; }
.term-ov .sheet { padding: 0; overflow: hidden; background: #0e1013; box-shadow: 0 0 0 1px #2a2e35, 0 24px 60px rgba(0,0,0,.4); }
.term { display: grid; grid-template-rows: auto 1fr auto; height: min(78vh, 720px); color: #d7dce3; font-size: 13px; }
.term-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid #23272e; font-family: var(--font); }

.term-head .btn.ghost { color: #aab2bd; }
.term-head .btn.ghost:hover { background: #1c2026; color: #fff; }

.term-out { overflow: auto; padding: 10px 16px; }
.tl { display: grid; grid-template-columns: 64px 80px 1fr; gap: 10px; padding: 2px 0; line-height: 1.45; }
.tl .tt { color: #5f6773; } .tl .ts { color: #7f8a99; overflow: hidden; text-overflow: ellipsis; }
.tl .tm { white-space: pre-wrap; word-break: break-word; }
.tl.error .tm, .tl.error .ts { color: #ff7a72; } .tl.warn .tm { color: #f3c05a; } .tl.ok .tm { color: #7fd99a; } .tl.cmd .tm { color: #fff; font-weight: 600; } .tl.cmd .ts { color: #9fe3b0; }
.term-in { display: flex; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #23272e; color: #9fe3b0; }
.term-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: #fff; font: inherit; font-size: 16px; }
@media (max-width: 560px) { .tl { grid-template-columns: 66px 1fr; } .tl .ts { display: none; } .term { height: 86vh; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
@media print { .side, .topbar, .tabbar { display: none; } }

<script>
/* Ritmo · logica pura (nessun accesso al DOM): date, modello dati, merge per la sync,
   punteggio del giorno, serie, XP, traguardi, parser rapido delle attività, export .ics.
   Funziona sia nel browser sia in Node (per i test). */
(function (root) {
  'use strict';

  const DAY = 86400000;
  const pad2 = n => String(n).padStart(2, '0');
  const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ───────────── date (giorno "logico": inizia all'ora dayStart, es. 04:00) ───────────── */
  const dkOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  function parseDK(dk) { const [y, m, d] = String(dk).split('-').map(Number); return new Date(y, m - 1, d); }
  const dayKey = (ts, startHour) => dkOf(new Date(ts - (startHour || 0) * 3600000));
  function addDays(dk, n) { const d = parseDK(dk); d.setDate(d.getDate() + n); return dkOf(d); }
  const diffDays = (a, b) => Math.round((parseDK(a) - parseDK(b)) / DAY);
  const weekdayOf = dk => parseDK(dk).getDay(); // 0 = domenica
  function mondayOf(dk) { const d = parseDK(dk); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dkOf(d); }
  function weekKey(dk) {
    const t = parseDK(dk); t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3); // giovedì della settimana ISO
    const y = t.getFullYear(); const f = new Date(y, 0, 4); f.setDate(f.getDate() - ((f.getDay() + 6) % 7) + 3);
    return y + '-W' + pad2(1 + Math.round((t - f) / (7 * DAY)));
  }
  function hm(s) { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); }
  const minOfDay = ts => { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes(); };
  function dayStartTs(dk, startHour) { const d = parseDK(dk); d.setHours(startHour || 0, 0, 0, 0); return d.getTime(); }
  const dayEndTs = (dk, startHour) => dayStartTs(addDays(dk, 1), startHour) - 1;
  function nextWeekday(todayDK, wd) { const diff = ((wd - weekdayOf(todayDK) + 7) % 7) || 7; return addDays(todayDK, diff); }

  /* ───────────── costanti di dominio ───────────── */
  const AREAS = [
    { id: 'oggi', name: 'Oggi', emoji: '☀️', color: 'progressi' },
    { id: 'acqua', name: 'Acqua', emoji: '💧', color: 'acqua' },
    { id: 'workout', name: 'Workout', emoji: '🏋️', color: 'workout' },
    { id: 'lavoro', name: 'Lavoro', emoji: '⏱️', color: 'lavoro' },
    { id: 'todo', name: 'Da fare', emoji: '✅', color: 'todo' },
    { id: 'progetti', name: 'Progetti', emoji: '🧭', color: 'progetti' },
    { id: 'casa', name: 'Casa', emoji: '🏠', color: 'casa' },
    { id: 'progressi', name: 'Progressi', emoji: '📈', color: 'progressi' },
  ];
  const MUSCLES = ['Petto', 'Schiena', 'Spalle', 'Braccia', 'Core', 'Gambe', 'Glutei', 'Cardio'];
  const WORKOUT_TYPES = [
    { id: 'circuito', name: 'Circuito casa', emoji: '♾️', groups: ['Petto', 'Braccia', 'Core', 'Gambe', 'Glutei'], min: 20, rpe: 7 },
    { id: 'forza', name: 'Forza', emoji: '🏋️', groups: [], min: 45, rpe: 7 },
    { id: 'corsa', name: 'Corsa', emoji: '🏃', groups: ['Cardio', 'Gambe'], min: 30, rpe: 6 },
    { id: 'camminata', name: 'Camminata', emoji: '🚶', groups: ['Cardio'], min: 40, rpe: 3 },
    { id: 'sport', name: 'Sport', emoji: '⚽', groups: ['Cardio', 'Gambe'], min: 60, rpe: 6 },
    { id: 'mobilita', name: 'Mobilità', emoji: '🧘', groups: [], min: 15, rpe: 3 },
  ];
  const FOCUS_MODES = {
    block: { name: 'Blocco 15′', work: 15, brk: 3 },
    pomodoro: { name: 'Pomodoro 25/5', work: 25, brk: 5 },
    deep: { name: 'Deep 50/10', work: 50, brk: 10 },
    free: { name: 'Libero', work: 0, brk: 0 },
  };
  const OS_TYPES = {
    water: { name: 'Acqua', area: 'acqua' }, plan: { name: 'Priorità', area: 'todo' },
    focus: { name: 'Blocco di lavoro', area: 'lavoro' }, chore: { name: 'Faccenda', area: 'casa' },
    workout: { name: 'Workout', area: 'workout' }, review: { name: 'Revisione', area: 'progressi' },
    custom: { name: 'Personalizzato', area: 'progetti' },
  };
  const CHORE_AREAS = ['Cucina', 'Bagno', 'Camera', 'Generale'];

  function defaultOS() {
    return [
      { id: 'os1', type: 'water', label: 'Acqua al risveglio', emoji: '💧', time: '08:30' },
      { id: 'os2', type: 'plan', label: 'Le 3 priorità', emoji: '🎯', time: '09:00' },
      { id: 'os3', type: 'focus', label: 'Blocco sul progetto', emoji: '⏱️', time: '09:30' },
      { id: 'os4', type: 'chore', label: 'Una faccenda', emoji: '🧽', time: '15:00' },
      { id: 'os5', type: 'workout', label: 'Workout', emoji: '🏋️', time: '18:00', workoutDaysOnly: true },
      { id: 'os6', type: 'focus', label: 'Secondo blocco', emoji: '🌆', time: '21:00' },
      { id: 'os7', type: 'review', label: 'Revisione serale', emoji: '🌙', time: '23:00' },
    ];
  }
  function defaultSettings() {
    return {
      name: '',
      dayStart: 4,
      wake: '08:30',
      water: { goal: 2000, bonus: 500, glass: 250, sizes: [150, 250, 330, 500], start: '09:00', end: '23:00', every: 90, plan: '' },
      workout: { perWeek: 3, days: [1, 3, 5], time: '18:00', plan: '' },
      work: { target: 120, days: [1, 2, 3, 4, 5], start: '09:30', mode: 'block', plan: '' },
      chores: { time: '15:00' },
      review: { time: '23:00', weeklyTime: '10:00' },
      remind: { water: true, workout: true, work: true, chores: true, review: true, weekly: true },
      os: defaultOS(),
      trackers: [],
      threshold: 60,
      weights: { water: 1, workout: 1, focus: 1.5, tasks: 1, chores: 0.75, os: 1 },
      u: 0,
    };
  }
  function seedChores(now) {
    const list = [
      ['Piatti / lavastoviglie', 'Cucina', 1, 10], ['Pulire il piano cucina', 'Cucina', 3, 5],
      ['Spazzatura e differenziata', 'Cucina', 3, 5], ['Rifare il letto', 'Camera', 1, 2],
      ['Riordinare la scrivania', 'Camera', 7, 10], ['Cambiare le lenzuola', 'Camera', 14, 15],
      ['Lavandino e specchio', 'Bagno', 7, 10], ['Bagno a fondo', 'Bagno', 14, 30],
      ['Lavatrice', 'Generale', 5, 10], ['Stendere e piegare', 'Generale', 5, 15],
      ['Aspirapolvere', 'Generale', 7, 20], ['Spesa', 'Generale', 7, 45],
    ];
    // partono "a metà", così non scadono tutte il primo giorno
    return list.map(([name, area, every, min], i) => ({
      id: 'c' + now.toString(36) + i, name, area, every, min, created: now,
      base: now - every * DAY * (0.35 + 0.4 * ((i * 7) % 10) / 10), u: now,
    }));
  }

  /* ───────────── stato, normalizzazione ───────────── */
  const COLLECTIONS = ['water', 'workouts', 'focus', 'tasks', 'projects', 'chores', 'choreLogs', 'goals', 'logs', 'widgets'];
  const MAPS = ['days', 'weeks'];
  function emptyState(now) {
    return {
      v: 1, settings: defaultSettings(),
      water: [], workouts: [], focus: [], tasks: [], projects: [], chores: [], choreLogs: [], goals: [], logs: [], widgets: [],
      days: {}, weeks: {}, timer: { status: 'idle', u: 0 }, meta: { created: now, onboarded: false },
    };
  }
  const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
  function deepDefaults(obj, def) {
    if (Array.isArray(def)) return Array.isArray(obj) ? obj : def.slice();
    if (isObj(def)) {
      const out = isObj(obj) ? { ...obj } : {};
      for (const k in def) out[k] = deepDefaults(out[k], def[k]);
      return out;
    }
    return obj === undefined || obj === null ? def : obj;
  }
  function normalize(s, now) {
    const base = emptyState(now || Date.now());
    if (!isObj(s)) return base;
    const out = { v: 1 };
    out.settings = deepDefaults(s.settings, base.settings);

        ${hist.length ? `<ul class="list">${hist.map(w => `<li><span aria-hidden="true" style="font-size:20px">${typeOf(w.type).emoji}</span><div class="grow"><div><b>${esc(typeOf(w.type).name)}</b> <span class="muted">${w.min}′, RPE ${w.rpe || '–'}</span></div><div class="small muted ellip">${esc(fmtRel(dayKey(w.ts, I.sh)))} alle ${fmtTime(w.ts)}${(w.groups || []).length ? '. ' + esc(w.groups.join(', ')) : ''}${w.note ? '. ' + esc(w.note) : ''}</div></div><button type="button" class="btn sm icon ghost" data-act="workout-del" data-id="${w.id}" aria-label="Elimina workout">✕</button></li>`).join('')}</ul>` : '<p class="empty">Nessun workout ancora. Il circuito da 20 minuti si registra con un tocco.</p>'}
      </section>
      ${planPanel('workout.plan', 'workout', 'Quando chiudo il portatile alle 18, allora faccio il circuito in camera.')}
    </div>`;
  };
  /* ═════════════ Ritmo · interfaccia (parte 2: Lavoro, Da fare, Progetti, Casa) ═════════════ */

  /* ═════════════ LAVORO (timer a blocchi) ═════════════ */
  const timerElapsed = (T = S.timer, n = now()) => (+T.acc || 0) + (T.status === 'run' || T.status === 'break' ? Math.max(0, n - T.at) / 1000 : 0);
  const timerRemaining = (T = S.timer, n = now()) => (T.plan ? T.plan - timerElapsed(T, n) : null);
  function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return (m >= 60 ? Math.floor(m / 60) + ':' + pad2(m % 60) : pad2(m)) + ':' + pad2(s); }
  let completing = false;
  function tick() {
    const T = S.timer, n = now();
    if ((T.status === 'run' || T.status === 'break') && T.plan && timerRemaining(T, n) <= 0 && !completing) {
      completing = true;
      try { completeTimer(T.at + (T.plan - (+T.acc || 0)) * 1000); } finally { completing = false; }
      return;
    }
    if (T.status === 'idle' || !T.status) { if (document.title !== 'Ritmo') document.title = 'Ritmo'; return; }
    const shown = T.plan ? timerRemaining(T, n) : timerElapsed(T, n);
    const txt = fmtClock(shown);
    $$('[data-tt]').forEach(e => { e.textContent = txt; });
    const r = $('#tring');
    if (r && T.plan) r.style.strokeDashoffset = +r.dataset.c * clamp(timerElapsed(T, n) / T.plan, 0, 1);
    document.title = (T.status === 'break' ? '☕ ' : T.status === 'pause' ? '⏸ ' : '⏱ ') + txt + ' · Ritmo';
  }
  function startFocus(o = {}) {
    const { I } = X(); const n = now();
    const mode = o.mode || sub.mode || S.settings.work.mode || 'block';
    const M = C.FOCUS_MODES[mode] || C.FOCUS_MODES.block;
    const potd = C.projectOfDay(S, I, I.today);
    const projectId = o.projectId !== undefined ? o.projectId : potd ? potd.id : null;
    const proj = projectId && I.live.projects.find(p => p.id === projectId);
    const label = o.label != null ? o.label : (proj && proj.nextAction) || '';
    ensureAudio();
    commit(() => { S.timer = { status: 'run', mode, plan: M.work * 60, acc: 0, at: n, first: n, label, projectId, u: n }; });
    sub.label = '';
  }
  function completeTimer(endTs) {
    const T = S.timer; const n = now();
    if (T.status === 'break') {
      commit(() => { S.timer = { status: 'idle', mode: T.mode, u: n }; });
      notify('☕ Pausa finita', 'Pronto per un altro blocco? Basta un tocco su Avvia.', 'focus');
      return;
    }
    const M = C.FOCUS_MODES[T.mode] || C.FOCUS_MODES.block;
    const min = Math.max(1, Math.round((T.plan || timerElapsed(T, endTs)) / 60));
    const id = 'f' + Math.round(T.first || endTs);
    commit(() => {
      if (!S.focus.some(f => f.id === id)) S.focus.push({ id, start: T.first || endTs - min * 60000, end: endTs, min, projectId: T.projectId || null, label: T.label || '', mode: T.mode, u: n });
      S.timer = M.brk && endTs + M.brk * 60000 > n
        ? { status: 'break', mode: T.mode, plan: M.brk * 60, acc: 0, at: endTs, first: endTs, label: '', projectId: T.projectId || null, u: n }
        : { status: 'idle', mode: T.mode, u: n };
    }, { xp: Math.round((min * 2) / 3) });
    notify('✅ Blocco completato', `${min}′ di lavoro${T.label ? ': ' + T.label : ''}.${M.brk ? ' Pausa di ' + M.brk + '′.' : ''}`, 'focus');
  }
  A['focus-start'] = () => {
    const label = ($('#f-label') || {}).value || '';
    const proj = ($('#f-proj') || {}).value;
    startFocus({ label: label.trim(), projectId: proj === undefined ? undefined : proj || null });
  };
  A['focus-quick'] = () => { startFocus({}); toast('Blocco da 15′ avviato. Solo il primo passo.'); };
  A['focus-mode'] = el => { sub.mode = el.dataset.id; render(); };
  A['focus-pause'] = () => { const n = now(); commit(() => { const T = S.timer; T.acc = timerElapsed(T, n); T.status = 'pause'; T.u = n; }); };
  A['focus-resume'] = () => { const n = now(); commit(() => { const T = S.timer; T.at = n; T.status = 'run'; T.u = n; }); };
  A['focus-plus'] = () => commit(() => { S.timer.plan = (S.timer.plan || 0) + 300; S.timer.u = now(); });
  A['focus-skipbreak'] = () => commit(() => { S.timer = { status: 'idle', mode: S.timer.mode, u: now() }; });
  A['focus-finish'] = () => {
    const T = S.timer, n = now(), el = timerElapsed(T, n);
    if (el < 60) { toast('Meno di un minuto: niente da salvare.'); return A['focus-skipbreak'](); }
    const min = Math.max(1, Math.round(el / 60)); const id = 'f' + Math.round(T.first);
    commit(() => {
      if (!S.focus.some(f => f.id === id)) S.focus.push({ id, start: T.first, end: n, min, projectId: T.projectId || null, label: T.label || '', mode: T.mode, u: n });
      S.timer = { status: 'idle', mode: T.mode, u: n };
    }, { xp: Math.round((min * 2) / 3) });
    toast(`Salvati ${min}′ di lavoro.`); beep();
  };
  A['focus-cancel'] = async () => {
    if (timerElapsed() > 120 && !(await ask('Annullare il blocco senza salvarlo?', 'Annulla il blocco', true))) return;
    commit(() => { S.timer = { status: 'idle', mode: S.timer.mode, u: now() }; });
  };
  A['focus-del'] = async el => { if (await ask('Eliminare questa sessione?', 'Elimina', true)) commit(() => tomb(S.focus, el.dataset.id)); };
  A['focus-stuck'] = () => openModal(`<form id="stuck-form" class="form">${sheetHead('Mi sono bloccato')}
      <p class="sub">Non chiudere la sessione: trasforma il blocco in un problema da risolvere. Il timer continua.</p>
      ${field('Cosa ti blocca?', '<textarea class="inp" name="what" autofocus placeholder="Es. non so come impostare la tabella dei dati"></textarea>', 'Finisce in Da fare come “🐞” collegato al progetto.')}
      ${field('Il prossimo micro-passo (2 minuti)', '<input class="inp" name="next" placeholder="Es. cercare un esempio di tabella e copiarlo">', 'Diventa il nuovo nome del blocco.')}
      <div class="sheet-foot"><button type="button" class="btn ghost" data-act="modal-close">Annulla</button><button class="btn key">Annota e continua</button></div></form>`);
  FORMS['stuck-form'] = (f, fd) => {
    const what = String(fd.get('what') || '').trim(), next = String(fd.get('next') || '').trim();
    commit(() => {
      if (what) S.tasks.push({ id: uid('t'), title: '🐞 ' + what, prio: 2, projectId: S.timer.projectId || null, due: null, created: now(), u: now() });
      if (next) { S.timer.label = next; S.timer.u = now(); }
    });
    closeModal(); toast(next ? 'Annotato. Adesso: ' + next : 'Annotato in Da fare.');
  };
  VIEWS.lavoro = () => {
    const { I } = X(); const T = S.timer; const st = S.settings.work; const n = now();
    const potd = C.projectOfDay(S, I, I.today);
    const active = I.live.projects.filter(p => p.status === 'active');
    const running = T.status && T.status !== 'idle';
    const modeId = running ? T.mode : sub.mode || st.mode || 'block';
    const M = C.FOCUS_MODES[modeId] || C.FOCUS_MODES.block;
    const plan = running ? T.plan : M.work * 60;
    const shown = running ? (T.plan ? timerRemaining(T, n) : timerElapsed(T, n)) : plan;
    const size = 236, stroke = 14, r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const prog = running && T.plan ? clamp(timerElapsed(T, n) / T.plan, 0, 1) : 0;
    const area = T.status === 'break' ? 'acqua' : 'lavoro';
    const face = `<div class="timer-face" style="${cv(area)}"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" style="stroke:color-mix(in srgb,var(--c) 20%,var(--inset))"/><circle id="tring" data-c="${c}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * prog}" transform="rotate(-90 ${size / 2} ${size / 2})" style="stroke:var(--c);transition:stroke-dashoffset 1s linear"/></svg><div class="inner"><div class="tt" data-tt role="timer">${fmtClock(shown)}</div><div class="tl">${T.status === 'break' ? 'Pausa: alzati, bevi, muoviti' : T.status === 'pause' ? 'In pausa' : running ? esc(M.name) : 'Pronto'}</div></div></div>`;
    const proj = running && T.projectId ? I.live.projects.find(p => p.id === T.projectId) : null;
    let ctrl;
    if (!running) {
      const selProj = sub.proj !== undefined ? sub.proj : potd ? potd.id : '';
      const p0 = selProj && active.find(p => p.id === selProj);
      ctrl = `<div class="form">
        <div class="seg" role="group" aria-label="Modalità">${Object.entries(C.FOCUS_MODES).map(([k, v]) => `<button type="button" data-act="focus-mode" data-id="${k}" aria-pressed="${k === modeId}">${v.name}</button>`).join('')}</div>
        ${field('Cosa fai in questo blocco?', `<input class="inp" id="f-label" value="${esc(sub.label || (p0 && p0.nextAction) || '')}" placeholder="Dai un nome al blocco: un verbo e un oggetto" autocomplete="off">`, 'Un blocco con un nome preciso è più facile da iniziare.')}
        ${field('Progetto', `<select class="inp" id="f-proj"><option value="">Nessun progetto</option>${active.map(p => `<option value="${p.id}" ${p.id === selProj ? 'selected' : ''}>${esc(p.emoji || '🧭')} ${esc(p.name)}${potd && p.id === potd.id ? ' (del giorno)' : ''}</option>`).join('')}</select>`)}
        <div class="btns"><button type="button" class="btn key" style="min-height:48px;padding:0 26px;font-size:17px" data-act="focus-start">Avvia ${M.work ? M.work + ' minuti' : 'il cronometro'}</button></div></div>`;
    } else if (T.status === 'break') {
      ctrl = `<div class="form"><h2>Pausa di ${Math.round(T.plan / 60)} minuti</h2><p class="sub">Staccare davvero aiuta a ripartire. Quando suona, riparti con un tocco.</p><div class="btns"><button type="button" class="btn key" data-act="focus-skipbreak">Salta la pausa</button></div></div>`;
    } else {
      ctrl = `<div class="form"><div><p class="muted small">In corso</p><h2 style="font-size:23px">${esc(T.label || 'Blocco senza nome')}</h2>${proj ? `<p class="sub">${esc(proj.emoji || '🧭')} ${esc(proj.name)}</p>` : ''}</div>
        <div class="btns">${T.status === 'pause' ? '<button type="button" class="btn key" data-act="focus-resume">Riprendi</button>' : '<button type="button" class="btn key" data-act="focus-pause">Pausa</button>'}${T.plan ? '<button type="button" class="btn" data-act="focus-plus">+5′</button>' : ''}<button type="button" class="btn" data-act="focus-finish">Termina e salva</button><button type="button" class="btn ghost" data-act="focus-cancel">Annulla</button></div>
        <button type="button" class="btn tint" style="${cv('todo')};justify-self:start" data-act="focus-stuck">🐞 Mi sono bloccato</button></div>`;
    }
    const todayMin = I.focusByDay[I.today] || 0;
    const sessions = (I.focusSessionsByDay[I.today] || []).slice().sort((a, b) => b.start - a.start);
    const days = [...Array(7)].map((_, i) => addDays(I.today, i - 6));
    const data = days.map(d => ({ v: I.focusByDay[d] || 0, label: WD_LETTER[weekdayOf(d)], tip: `${cap(fmtRel(d))}: ${fmtMin(I.focusByDay[d] || 0)}`, d }));
    const byProj = {};
    for (const d of days) for (const f of I.focusSessionsByDay[d] || []) byProj[f.projectId || ''] = (byProj[f.projectId || ''] || 0) + (+f.min || 0);
    const rows = Object.entries(byProj).sort((a, b) => b[1] - a[1]);
    const maxP = rows.length ? rows[0][1] : 1;
    const pname = id => { const p = I.live.projects.find(x => x.id === id); return p ? (p.emoji || '🧭') + ' ' + p.name : 'Senza progetto'; };
    return `<div class="view-head"><h1 class="h1"><span class="dot" style="${cv('lavoro')}"></span>Lavoro</h1></div>
    <div class="stack">
      <section class="panel timer">${face}${ctrl}</section>
      <div class="cols">
        <section class="panel" style="${cv('lavoro')}"><div class="panel-head"><h2>Oggi</h2><span class="muted small">${sessions.length} ${sessions.length === 1 ? 'sessione' : 'sessioni'}</span></div>
          <div class="val" style="font-size:30px;font-weight:800;margin-bottom:10px">${fmtMin(todayMin)} <small style="font-size:15px;color:var(--muted);font-weight:650">di ${fmtMin(st.target)}</small></div>
          ${bar(todayMin / Math.max(1, st.target), 'lavoro')}
          ${sessions.length ? `<ul class="list" style="margin-top:10px">${sessions.map(f => `<li><span class="num muted">${fmtTime(f.start)}</span><div class="grow"><div class="ellip"><b>${esc(f.label || 'Blocco')}</b></div><div class="small muted ellip">${esc(pname(f.projectId))}</div></div><span class="num">${f.min}′</span><button type="button" class="btn sm icon ghost" data-act="focus-del" data-id="${f.id}" aria-label="Elimina sessione">✕</button></li>`).join('')}</ul>` : '<p class="empty" style="margin-top:14px">Nessun blocco ancora. 15 minuti bastano per iniziare: la spinta arriva dopo.</p>'}
        </section>
        <section class="panel"><div class="panel-head"><h2>Ultimi 7 giorni</h2><span class="muted small">${fmtMin(data.reduce((a, x) => a + x.v, 0))}</span></div>
          ${barChart({ data, color: 'var(--lavoro)', goal: st.target, fmt: v => (v >= 60 ? NF2.format(v / 60) + ' h' : Math.round(v) + '′'), label: 'Minuti di lavoro negli ultimi 7 giorni' })}
          ${rows.length ? `<hr class="sep"><h3 style="margin-bottom:8px">Per progetto</h3>${rows.map(([id, m]) => `<div class="hbar"><span class="ellip">${esc(pname(id))}</span>${bar(m / maxP, 'lavoro')}<span class="v">${fmtMin(m)}</span></div>`).join('')}` : ''}
          ${dataTable(['Giorno', 'Lavoro'], data.slice().reverse().map(x => [fmtRel(x.d), fmtMin(x.v)]))}
        </section>
      </div>
      ${planPanel('work.plan', 'lavoro', 'Quando finisco la colazione, allora apro il progetto del giorno e avvio 15 minuti.')}
    </div>`;
  };

  /* ═════════════ DA FARE ═════════════ */
  const repText = r => (r.n === 1 ? { d: 'ogni giorno', w: 'ogni settimana', m: 'ogni mese' }[r.unit] : `ogni ${r.n} ${{ d: 'giorni', w: 'settimane', m: 'mesi' }[r.unit]}`);
  function addTaskFromText(text, o = {}) {
    const { I } = X(); const q = C.parseQuick(text, I.today, I.live.projects);
    if (!q.title) { toast('Scrivi almeno il titolo.'); return null; }
    const n = now();
    if (q.star && I.live.tasks.filter(t => t.star === I.today && !t.done).length >= 3) { q.star = false; toast('Hai già 3 priorità per oggi: aggiunta senza stella.'); }
    const t = { id: uid('t'), title: q.title, due: q.due, prio: q.prio || 2, projectId: q.projectId || o.projectId || null, quick: q.quick, repeat: q.repeat, star: q.star || o.star ? I.today : null, done: null, created: n, u: n };
    commit(() => S.tasks.push(t), { render: o.render });
    return t;
  }
  function previewChips(q) {
    const c = [];
    if (q.due) c.push(`<span class="chip">📅 ${esc(fmtRel(q.due))}</span>`);
    if (q.projectName) c.push(`<span class="chip">🧭 ${esc(q.projectName)}</span>`);
    if (q.prio === 1) c.push('<span class="chip">priorità alta</span>'); else if (q.prio === 3) c.push('<span class="chip">priorità bassa</span>');
    if (q.quick) c.push('<span class="chip">⚡ 2 minuti</span>');
    if (q.repeat) c.push(`<span class="chip">↻ ${repText(q.repeat)}</span>`);
    if (q.star) c.push('<span class="chip">⭐ priorità di oggi</span>');
    return c.join('');
  }
  document.addEventListener('input', e => {
    if (e.target.id === 'qa') {
      const { I } = X(); const box = $('#qa-prev');
      if (box) box.innerHTML = e.target.value.trim() ? previewChips(C.parseQuick(e.target.value, I.today, I.live.projects)) : '';
    }
    if (e.target.id === 'f-label') sub.label = e.target.value;
    if (e.target.dataset && e.target.dataset.out) { const o = document.getElementById(e.target.dataset.out); if (o) o.textContent = e.target.value; }
  });
  document.addEventListener('change', e => { if (e.target.id === 'f-proj') sub.proj = e.target.value; });
  FORMS['qa-form'] = f => {
    const inp = $('#qa', f); const text = inp.value.trim(); if (!text) return;
    const t = addTaskFromText(text, { render: false });
    if (t) { render({ focus: '#qa' }); toast('Aggiunta: ' + t.title + (t.due ? ' (' + fmtRel(t.due) + ')' : '')); }
  };
  function taskRow(t, I) {
    const p = t.projectId && I.live.projects.find(x => x.id === t.projectId);
    const ch = [];
    if (t.due && !t.done) { const n = diffDays(t.due, I.today); ch.push(`<span class="chip ${n < 0 ? 'st-crit' : n === 0 ? 'st-warn' : ''}">${n < 0 ? 'scaduta da ' + -n + ' g' : esc(fmtRel(t.due))}</span>`); }
    if (t.done) ch.push(`<span class="chip">fatta ${esc(fmtRel(dayKey(t.done, I.sh)))}</span>`);
    if (p) ch.push(`<span class="chip">${esc(p.emoji || '🧭')} ${esc(p.name)}</span>`);
    if (t.prio === 1) ch.push('<span class="chip">priorità alta</span>');
    if (t.quick) ch.push('<span class="chip">⚡ 2 min</span>');
    if (t.repeat) ch.push(`<span class="chip">↻ ${repText(t.repeat)}</span>`);
    return `<li style="${cv('todo')};${onInk('todo')}"><button type="button" class="check ${t.done ? 'on' : ''}" data-act="task-toggle" data-id="${t.id}" aria-label="${t.done ? 'Riapri' : 'Completa'}: ${esc(t.title)}">${ICON_CHECK}</button>
      <button type="button" class="rowbtn" data-act="task-edit" data-id="${t.id}"><span class="ellip" style="display:block;${t.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.title)}</span>${ch.length ? `<span class="row" style="gap:6px;margin-top:5px">${ch.join('')}</span>` : ''}</button>
      ${t.done ? '' : `<button type="button" class="star ${t.star === I.today ? 'on' : ''}" data-act="task-star" data-id="${t.id}" aria-pressed="${t.star === I.today}" aria-label="Priorità di oggi" title="Priorità di oggi (massimo 3)">⭐</button>`}</li>`;
  }
  const sortTasks = (a, b) => (b.star === X().I.today) - (a.star === X().I.today) || (a.prio || 2) - (b.prio || 2) || String(a.due || '9999').localeCompare(String(b.due || '9999')) || (a.created || 0) - (b.created || 0);
  const taskList = (arr, I) => `<ul class="list">${arr.map(t => taskRow(t, I)).join('')}</ul>`;
  VIEWS.todo = () => {
    const { I } = X(); const f = sub.todo || 'oggi'; const today = I.today;
    const open = I.live.tasks.filter(t => !t.done);
    const isToday = t => (t.due && t.due <= today) || t.star === today;
    const isInbox = t => !t.due && !t.projectId && t.star !== today;
    const counts = { oggi: open.filter(isToday).length, inbox: open.filter(isInbox).length, prossimi: open.filter(t => t.due && t.due > today).length, tutte: open.length };
    const tabs = [['oggi', 'Oggi'], ['inbox', 'Inbox'], ['prossimi', 'Prossimi'], ['tutte', 'Tutte'], ['matrice', 'Matrice'], ['fatte', 'Fatte']];
    let body = '';
    const sec = (title, arr, extra = '') => (arr.length ? `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="muted small">${arr.length}${extra}</span></div>${taskList(arr.sort(sortTasks), I)}</section>` : '');
    if (f === 'oggi') {
      const late = open.filter(t => t.due && t.due < today), tod = open.filter(t => isToday(t) && !(t.due && t.due < today));
      const quick = open.filter(t => t.quick && !isToday(t));
      body = sec('In ritardo', late) + sec('Oggi', tod) + sec('⚡ Da 2 minuti: falle subito', quick);
      if (!late.length && !tod.length) body = `<p class="empty"><b>Niente in scadenza oggi.</b> Scegli fino a 3 priorità con la stella, o pesca dalla Inbox.</p>` + body;
    } else if (f === 'inbox') {
      const arr = open.filter(isInbox);
      body = arr.length ? `<section class="panel"><div class="panel-head"><h2>Inbox</h2><span class="muted small">Tutto quello che hai scaricato. Dagli una data, un progetto o una stella, oppure fallo.</span></div>${taskList(arr.sort((a, b) => (b.created || 0) - (a.created || 0)), I)}</section>` : '<p class="empty"><b>Inbox vuota.</b> Scrivi qui sopra o usa “Scarica la testa” in Oggi.</p>';
    } else if (f === 'prossimi') {
      const arr = open.filter(t => t.due && t.due > today).sort((a, b) => a.due.localeCompare(b.due));
      const groups = {}; arr.forEach(t => (groups[t.due] ||= []).push(t));
      body = arr.length ? Object.entries(groups).map(([d, ts]) => sec(cap(fmtRel(d)), ts)).join('') : '<p class="empty">Niente in programma nei prossimi giorni.</p>';

  /* ═════════════ SYNC (GitHub Gist segreto) ═════════════ */
  const GIST_FILE = 'ritmo-data.json', GIST_DESC = 'Ritmo · dati sincronizzati (non modificare)';
  const Sync = {
    busy: false, again: false, err: '', last: 0,
    token() { return store.get(LS.token, ''); },
    async api(path, opt = {}) {
      const res = await fetch('https://api.github.com' + path, {
        method: opt.method || 'GET', cache: 'no-store', body: opt.body,
        headers: Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + this.token(), 'X-GitHub-Api-Version': '2022-11-28' }, opt.body ? { 'Content-Type': 'application/json' } : {}),

      return res.status === 204 ? null : res.json();
    },
    async gistId() {
      let id = store.get(LS.gist, ''); if (id) return id;
      for (let page = 1; page <= 10 && !id; page++) {
        const list = await this.api('/gists?per_page=100&page=' + page);
        const g = (list || []).find(x => x.files && x.files[GIST_FILE] && x.description === GIST_DESC);
        if (g) id = g.id; if (!list || list.length < 100) break;
      }
      if (!id) {
        const g = await this.api('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(S) } } }) });
        id = g.id;
      }
      store.set(LS.gist, id); return id;
    },
    async run() {
      if (!this.token()) return;
      if (this.busy) { this.again = true; return; }
      this.busy = true; this.err = ''; updateSyncUI();
      try {
        const id = await this.gistId();
        const g = await this.api('/gists/' + id);
        const f = g.files && g.files[GIST_FILE];
        let remote = null;
        if (f) {
          let content = f.content;
          if (f.truncated && f.raw_url) content = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
          try { remote = JSON.parse(content); } catch (e) { remote = null; }
        }
        const n = now();
        const merged = C.prune(C.normalize(C.merge(S, remote), n), n);
        const mergedC = C.canon(merged);
        if (mergedC !== C.canon(S)) {

          S = merged;
          ver++; save(); if (!$('#modal')) render();
          log('info', 'sync', 'dati aggiornati dal Gist');
        }
        if (!remote || mergedC !== C.canon(C.normalize(remote, n))) await this.api('/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(merged) } } }) });

        if (e.status === 404) store.del(LS.gist);

    const { I } = X(); const v = C.trackerValue(I, tr, I.today); const goal = +tr.goal || 0;
    const over = tr.limit && goal && v > goal;
    const note = !goal ? '' : tr.limit ? (v === null ? `Limite: ${goal} ${esc(tr.unit)}.` : over ? `Oltre il limite di ${goal} ${esc(tr.unit)}.` : `Sotto il limite di ${goal} ${esc(tr.unit)}.`) : `Obiettivo: ${goal} ${esc(tr.unit)}.`;
    return `<section class="panel tile" style="--c:var(--${over ? 'crit' : 'progressi'})"><div class="tile-head"><span class="dot"></span><h2>${esc(tr.emoji || '•')} ${esc(tr.name)}</h2><span class="muted small">${tr.mode === 'last' ? 'ultimo valore' : 'totale di oggi'}</span></div>
      <div class="val">${v === null ? '–' : fmtNum(v)} <small>${esc(tr.unit || '')}</small></div>${goal ? bar((v || 0) / goal, over ? 'crit' : 'progressi') : ''}<p class="note">${note}</p>
      <div class="btns">${tr.mode === 'sum' ? `<button type="button" class="btn tint sm" data-act="tr-add" data-id="${tr.id}" data-v="${tr.step || 1}">+${fmtNum(tr.step || 1)}</button>` : ''}<button type="button" class="btn tint sm" data-act="tr-set" data-id="${tr.id}">${tr.mode === 'sum' ? 'Altro valore' : 'Inserisci'}</button></div></section>`;
  }
  const fmtNum = v => new Intl.NumberFormat('it-IT', { maximumFractionDigits: 2 }).format(v);
  A['tr-add'] = el => logTracker(el.dataset.id, +el.dataset.v);
  A['tr-set'] = el => {
    const tr = trackers().find(t => t.id === el.dataset.id); if (!tr) return;
    openModal(`<form id="tr-form" class="form" data-id="${tr.id}">${sheetHead(esc((tr.emoji || '') + ' ' + tr.name))}${field('Valore (' + esc(tr.unit || 'numero') + ')', `<input class="inp" name="v" type="text" inputmode="decimal" autocomplete="off" autofocus value="${tr.mode === 'last' ? esc(C.trackerValue(X().I, tr, X().I.today) ?? '') : ''}">`, tr.mode === 'last' ? 'Conta l’ultimo valore inserito oggi.' : 'Si somma agli altri di oggi.')}<div class="sheet-foot"><button type="button" class="btn ghost" data-act="modal-close">Annulla</button><button class="btn key">Salva</button></div></form>`);
  };
  FORMS['tr-form'] = (f, fd) => { const v = parseFloat(String(fd.get('v')).replace(',', '.')); if (!isFinite(v)) return toast('Inserisci un numero.'); closeModal(); logTracker(f.dataset.id, v); };
  A['tr-new'] = el => {
    const p = el.dataset.preset !== undefined ? TRACKER_PRESETS[+el.dataset.preset] : { name: 'Nuovo tracker', emoji: '✨', unit: '', mode: 'sum', goal: 0, step: 1 };
    const base = String(p.name).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-'); let id = base; let i = 2;
    while (trackers().some(t => t.id === id)) id = base + '-' + i++;
    commit(() => { S.settings.trackers = [...trackers(), { id, ...p }]; S.settings.u = now(); });
  };
  A['tr-del'] = async el => { if (await ask('Eliminare il tracker? I valori registrati restano nel file tracker.csv.', 'Elimina', true)) commit(() => { S.settings.trackers = trackers().filter(t => t.id !== el.dataset.id); S.settings.u = now(); }); };
  document.addEventListener('change', e => {
    const el = e.target; if (!el.dataset || el.dataset.tr === undefined) return;
    const tr = trackers()[+el.dataset.tr]; if (!tr) return; const k = el.dataset.k;
    const v = el.type === 'checkbox' ? el.checked : ['goal', 'step'].includes(k) ? parseFloat(String(el.value).replace(',', '.')) || 0 : el.value;
    commit(() => { tr[k] = v; S.settings.u = now(); });
  });

  /* ───────────── WIDGET PERSONALIZZATI ───────────── */
  const WIDGETS = { defs: {}, codes: {}, err: {} };
  function dayInfo(dk) {
    const { I, streak } = X(); const r = streak.scores[dk];
    const tr = {}; for (const t of trackers()) tr[t.id] = C.trackerValue(I, t, dk);
    return { data: dk, label: WD_LETTER[weekdayOf(dk)], acqua: I.waterByDay[dk] || 0, obiettivoAcqua: C.waterGoal(S, I, dk), lavoro: I.focusByDay[dk] || 0, workout: (I.workoutsByDay[dk] || []).length, attivita: (I.tasksDoneByDay[dk] || []).length, faccende: (I.choreDoneByDay[dk] || []).length, punteggio: r && r.score !== null ? r.score : null, energia: dayVal(dk, 'energy'), tracker: tr };
  }
  function widgetAPI() {
    const { I } = X();
    return {
      state: S, settings: S.settings, oggi: I.today, today: I.today, version: VERSION, X,
      day: dk => dayInfo(dk || I.today), series: (n = 7) => [...Array(Math.max(1, n))].map((_, i) => dayInfo(addDays(I.today, i - n + 1))),
      tracker: id => { const t = trackers().find(x => x.id === id); return t ? C.trackerValue(I, t, I.today) : null; },
      add: { water: ml => A.water(null, ml), task: t => addTaskFromText(t), log: (id, v) => logTracker(id, v), chore: name => applyActions([{ kind: 'chore', name }], 'widget'), workout: o => applyActions([{ kind: 'workout', type: o.tipo || o.type, min: o.minuti || o.min, rpe: o.rpe, groups: o.gruppi || [] }], 'widget') },
      ui: { esc, bar, ring, chart: (data, color, goal) => barChart({ data, color, goal: goal || 0 }), fmtMin, fmtMl, fmtN },
      toast: m => toast(String(m)), go, log: (...a) => log('info', 'widget', ...a),
    };
  }
  function loadWidget(w) {
    if (WIDGETS.codes[w.id] === w.code) return WIDGETS.defs[w.id];
    WIDGETS.codes[w.id] = w.code; WIDGETS.defs[w.id] = null; WIDGETS.err[w.id] = '';
    try {
      const reg = { widget: def => { WIDGETS.defs[w.id] = def; } };
      new Function('Ritmo', '"use strict";\n' + w.code)(reg);
      if (!WIDGETS.defs[w.id]) throw new Error('il file non chiama Ritmo.widget({...})');
    } catch (e) { WIDGETS.err[w.id] = e.message; log('error', 'widget', w.name + ': ' + e.message); }
    return WIDGETS.defs[w.id];
  }
  function widgetTile(w) {
    const def = loadWidget(w); let body;
    if (def) {
      try { body = String(def.render ? def.render(widgetAPI()) : ''); WIDGETS.err[w.id] = ''; }
      catch (e) { if (WIDGETS.err[w.id] !== e.message) log('error', 'widget', w.name + ': ' + e.message); WIDGETS.err[w.id] = e.message; body = null; }
    }
    const title = def && def.title ? def.title : w.name;
    const area = def && def.area && AREA[def.area] ? def.area : 'progressi';
    if (body == null) body = `<p class="note">⚠ Errore nel widget: ${esc(WIDGETS.err[w.id] || 'sconosciuto')}</p><div class="btns"><button type="button" class="btn sm" data-act="terminal">Apri terminale</button></div>`;
    return `<section class="panel tile${def && def.size === 2 ? ' span2' : ''}" style="${cv(area)}" data-widget="${esc(w.id)}"><div class="tile-head"><span class="dot"></span><h2>${esc(title)}</h2><span class="muted small">widget</span></div>${body}</section>`;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-wact]'); if (!b) return;
    const box = b.closest('[data-widget]'); const def = box && WIDGETS.defs[box.dataset.widget]; if (!def) return;
    const fn = (def.azioni || def.actions || {})[b.dataset.wact]; if (!fn) return log('error', 'widget', 'azione mancante: ' + b.dataset.wact);
    e.preventDefault();
    try { const r = fn(widgetAPI(), b); if (r && r.catch) r.catch(err => log('error', 'widget', err)); } catch (err) { log('error', 'widget', err); toast('Errore nel widget: ' + err.message, 'warn'); }
  });
  function customTiles() {
    const { I } = X();
    return trackers().map(trackerTile).join('') + I.live.widgets.filter(w => w.enabled !== false).map(widgetTile).join('');
  }
  function openWidgetEditor(id) {
    const w = id ? S.widgets.find(x => x.id === id) : { name: 'mio-widget.js', code: EXAMPLE_WIDGET.replace('Acqua, ultimi 7 giorni', 'Il mio widget') };
    if (!w) return;
    const ro = w.src === 'cartella';
    openModal(`<form id="wid-form" class="form" data-id="${id || ''}">${sheetHead(id ? 'Widget' : 'Nuovo widget')}
      ${ro ? '<p class="sub small">Questo widget arriva dalla cartella: modifica il file in widgets/, Ritmo lo ricarica da solo.</p>' : ''}
      ${field('Nome', `<input class="inp" name="name" value="${esc(w.name)}" ${ro ? 'readonly' : ''}>`)}
      ${field('Codice', `<textarea class="inp code" name="code" rows="16" spellcheck="false" ${ro ? 'readonly' : ''}>${esc(w.code)}</textarea>`, 'API: api.series(n), api.day(), api.tracker(id), api.add.water/task/log/chore/workout, api.ui.bar/ring/chart, api.toast, api.go. Bottoni: data-wact="nome" + azioni: { nome(api) {} }.')}
      <div class="sheet-foot">${id ? `<button type="button" class="btn ghost danger spacer" data-act="wid-del" data-id="${esc(id)}">Elimina</button>` : ''}<button type="button" class="btn ghost" data-act="modal-close">Chiudi</button>${ro ? '' : '<button class="btn key">Salva</button>'}</div></form>`, { wide: true });
  }
  A['wid-new'] = () => openWidgetEditor(null);
  A['wid-edit'] = el => openWidgetEditor(el.dataset.id);
  A['wid-toggle'] = el => { const w = S.widgets.find(x => x.id === el.dataset.id); if (w) commit(() => { w.enabled = w.enabled === false; w.u = now(); }); };
  A['wid-del'] = async el => { const id = el.dataset.id; if (await ask('Eliminare il widget?', 'Elimina', true, id.startsWith('file:') ? 'Cancella anche il file nella cartella widgets/, altrimenti torna.' : '')) commit(() => tomb(S.widgets, id)); };
  FORMS['wid-form'] = (f, fd) => {
    const id = f.dataset.id; const n = now(); const code = String(fd.get('code') || ''); const name = String(fd.get('name') || 'widget.js').trim();
    commit(() => { if (id) Object.assign(S.widgets.find(x => x.id === id), { code, name, u: n }); else S.widgets.push({ id: uid('wg'), name, code, src: 'editor', enabled: true, u: n }); });
    closeModal(); const nid = id || S.widgets[S.widgets.length - 1].id;
    toast(WIDGETS.err[nid] ? 'Salvato, ma con un errore: apri il terminale' : 'Widget salvato: lo trovi in Oggi', WIDGETS.err[nid] ? 'warn' : '');
  };

  /* ───────────── sezioni aggiunte alle Impostazioni ───────────── */
  function extraSettings() {
    const { I } = X(); const errs = TERM.lines.filter(l => l.lv === 'error').length;
    const fold = Folder.state === 'on'
      ? `<p class="sub">Collegata a <b>${esc(Folder.dir.name)}</b>${Folder.last ? ', ultima scrittura alle ' + fmtTime(Folder.last) : ''}.</p><div class="btns" style="margin-top:10px"><button type="button" class="btn key sm" data-act="folder-now">Aggiorna adesso</button><button type="button" class="btn sm ghost danger" data-act="folder-off">Scollega</button></div>`
      : Folder.state === 'perm' ? `<p class="sub">Chrome chiede di confermare di nuovo l’accesso a <b>${esc(Folder.dir.name)}</b>.</p><div class="btns" style="margin-top:10px"><button type="button" class="btn key sm" data-act="folder-perm">Riattiva accesso</button><button type="button" class="btn sm ghost" data-act="folder-off">Scollega</button></div>`
      : Folder.supported() ? `<p class="sub">Scegli una cartella, ad esempio Documenti/Ritmo o una cartella in iCloud Drive. Ritmo ci scrive i dati in CSV, JSON e Markdown dopo ogni modifica.</p><div class="btns" style="margin-top:10px"><button type="button" class="btn key sm" data-act="folder-pick">Scegli cartella</button></div>`
      : `<p class="sub">Questo browser non permette alle web app di scrivere in una cartella (succede con Safari, su Mac e su iPhone). Sul Mac apri Ritmo in <b>Chrome</b> o <b>Edge</b> e installalo con l’icona “Installa” nella barra degli indirizzi. I dati arrivano lo stesso anche qui tramite la sync.</p>`;
    return `<div class="cols">
      <section class="panel" id="sec-folder"><div class="panel-head"><h2>Cartella dati</h2>${Folder.state === 'on' ? '<span class="chip st-good">collegata</span>' : ''}</div>${fold}
        <p class="small muted" style="margin-top:12px"><b>dati/</b> CSV e JSON da leggere e analizzare (sola lettura). <b>inbox/</b> qui altre app o AI lasciano file .json/.md per aggiungere dati. <b>widgets/</b> file .js con i tuoi riquadri. <b>log/</b> gli errori del terminale. Le istruzioni complete sono in LEGGIMI.md dentro la cartella.</p></section>
      <section class="panel"><div class="panel-head"><h2>Terminale</h2>${errs ? `<span class="chip st-crit">${errs} ${errs === 1 ? 'errore' : 'errori'}</span>` : '<span class="chip st-good">nessun errore</span>'}</div>
        <p class="sub small">Messaggi, errori di app, sync, cartella e widget, con un prompt per comandi e JavaScript. Si apre anche con il tasto <span class="kbd">\`</span> o da ⌘K.</p>
        <div class="btns" style="margin-top:12px"><button type="button" class="btn key" data-act="terminal">Apri il terminale</button></div></section>
    </div>
    <section class="panel"><div class="panel-head"><h2>Tracker personalizzati</h2><button type="button" class="btn sm" data-act="tr-new">Nuovo</button></div>
      <p class="sub small" style="margin-bottom:10px">Qualsiasi numero da seguire ogni giorno: compare in Oggi, nei file e nell’API dei widget. “Somma” somma i valori del giorno, “ultimo” tiene l’ultimo valore inserito. “Limite” vuol dire che meno è meglio.</p>
      ${trackers().length ? `<ol class="list">${trackers().map((t, i) => `<li class="row" style="flex-wrap:wrap;gap:8px"><input class="inp sm" style="width:54px;text-align:center" data-tr="${i}" data-k="emoji" value="${esc(t.emoji || '')}" aria-label="Emoji"><input class="inp sm" style="flex:1;min-width:120px" data-tr="${i}" data-k="name" value="${esc(t.name)}" aria-label="Nome"><input class="inp sm" style="width:90px" data-tr="${i}" data-k="unit" value="${esc(t.unit || '')}" placeholder="unità" aria-label="Unità"><select class="inp sm" style="width:auto" data-tr="${i}" data-k="mode" aria-label="Tipo"><option value="sum" ${t.mode !== 'last' ? 'selected' : ''}>somma</option><option value="last" ${t.mode === 'last' ? 'selected' : ''}>ultimo</option></select><input class="inp sm" style="width:90px" data-tr="${i}" data-k="goal" value="${esc(t.goal || '')}" placeholder="obiettivo" inputmode="decimal" aria-label="Obiettivo"><input class="inp sm" style="width:72px" data-tr="${i}" data-k="step" value="${esc(t.step || 1)}" inputmode="decimal" aria-label="Passo" title="Quanto aggiunge il tasto +"><label class="small row" style="gap:6px"><input type="checkbox" data-tr="${i}" data-k="limit" ${t.limit ? 'checked' : ''}>limite</label><span class="small muted">id: ${esc(t.id)}</span><button type="button" class="btn sm icon ghost danger" data-act="tr-del" data-id="${esc(t.id)}" aria-label="Elimina">✕</button></li>`).join('')}</ol>` : ''}
      <div class="btns" style="margin-top:10px">${TRACKER_PRESETS.filter(p => !trackers().some(t => t.name === p.name)).map(p => `<button type="button" class="btn sm tint" style="--c:var(--progressi)" data-act="tr-new" data-preset="${TRACKER_PRESETS.indexOf(p)}">${p.emoji} ${p.name}</button>`).join('')}</div></section>
    <section class="panel"><div class="panel-head"><h2>Widget</h2><button type="button" class="btn sm" data-act="wid-new">Nuovo widget</button></div>
      <p class="sub small" style="margin-bottom:10px">Riquadri tuoi in JavaScript, mostrati in Oggi. Puoi scriverli qui o come file .js nella cartella widgets/. Si sincronizzano anche su iPhone.</p>
      ${I.live.widgets.length ? `<ul class="list">${I.live.widgets.map(w => `<li><span class="dot" style="--c:var(--${WIDGETS.err[w.id] ? 'crit' : 'progressi'})"></span><button type="button" class="rowbtn" data-act="wid-edit" data-id="${esc(w.id)}"><b>${esc(w.name)}</b><span class="small muted" style="display:block">${w.src === 'cartella' ? 'dalla cartella' : 'creato qui'}${WIDGETS.err[w.id] ? '. Errore: ' + esc(WIDGETS.err[w.id]) : ''}</span></button><label class="switch" title="Mostra in Oggi"><input type="checkbox" data-act="wid-toggle" data-id="${esc(w.id)}" ${w.enabled !== false ? 'checked' : ''}><i></i></label></li>`).join('')}</ul>` : '<p class="empty">Nessun widget. “Nuovo widget” parte da un esempio funzionante.</p>'}</section>`;
  }

  /* ───────────── avvio della parte 4 ───────────── */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (e.key === '`' && !['input', 'textarea', 'select'].includes(tag) && !$('#modal')) { e.preventDefault(); openTerminal(); }
  });
  setInterval(() => { if (document.visibilityState === 'visible') Folder.cycle(false); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Folder.cycle(false); });
  const baseInit = init;
  init = function () {
    baseInit();
    log('info', 'avvio', `Ritmo ${VERSION} avviato`);
    Folder.restore().then(() => { if (view === 'impostazioni') render(); });
    Object.assign(window.Ritmo, { log: (...a) => log('info', 'utente', ...a), terminal: openTerminal, folder: Folder, applyActions });
    Object.defineProperty(window.Ritmo, 'api', { get: widgetAPI, configurable: true });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => init()); else init();
})();

</script>
</body>
</html>
